name: Bug report
description: Something is broken or doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: what-expected
    attributes:
      label: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal steps — CodeSandbox / StackBlitz / repo link strongly preferred
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: '`@okaybabe/shaders` version'
      description: Output of `npm ls @okaybabe/shaders` or relevant lockfile line
    validations:
      required: true
  - type: input
    id: react-version
    attributes:
      label: React version
    validations:
      required: true
  - type: input
    id: r3f-version
    attributes:
      label: react-three-fiber + three version (if using `/r3f` subpath)
  - type: input
    id: env
    attributes:
      label: Browser / OS / device
      description: Especially relevant for WebGL / GPU bugs
    validations:
      required: true
